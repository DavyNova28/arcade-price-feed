<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mini Golf Signage</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #signage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .signage-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      opacity: 0;

      transition-property: opacity;
      transition-timing-function: ease-in-out;

      transform: translateZ(0);
      will-change: opacity;
    }

    .signage-image.visible {
      opacity: 1;
    }

    #status {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 100;

      max-width: calc(100% - 44px);
      padding: 10px;

      color: white;
      background: rgba(0, 0, 0, 0.85);

      border-radius: 5px;

      font-family: Arial, sans-serif;
      font-size: 14px;

      display: none;
    }

    body.debug #status {
      display: block;
    }
  </style>
</head>

<body>
  <main id="signage">
    <img
      id="imageA"
      class="signage-image"
      alt=""
    >

    <img
      id="imageB"
      class="signage-image"
      alt=""
    >

    <div id="status">Starting signage…</div>
  </main>

  <script>
    /*
     * Paste your existing Apps Script /exec URL here.
     */
    const SCHEDULE_FEED_URL =
      "https://script.google.com/macros/s/AKfycbwUINP9DCEUywwCU1YMjfnPT3H8ZUq1lsGVk8ShACrTp2EZIqMYrChADlk_uEh2F-DGXw/exec";

    const SCHEDULE_REFRESH_MS = 30000;
    const CLOCK_CHECK_MS = 1000;
    const DEFAULT_FADE_MS = 1500;

    /*
     * Read the screen name from the GitHub Pages URL.
     *
     * Example:
     * ?screen=Arcade
     */
    const queryParameters =
      new URLSearchParams(window.location.search);

    const SCREEN_NAME =
      queryParameters.get("screen") || "Schedule";

    const DEBUG_MODE =
      queryParameters.get("debug") === "1";

    if (DEBUG_MODE) {
      document.body.classList.add("debug");
    }

    let schedule = [];
    let currentImageName = null;
    let visibleLayer = "A";
    let feedRequestNumber = 0;

    const imageA =
      document.getElementById("imageA");

    const imageB =
      document.getElementById("imageB");

    const statusElement =
      document.getElementById("status");

    window.onerror = function(
      message,
      source,
      lineNumber
    ) {
      showError(
        `JavaScript error: ${message}, line ${lineNumber}`
      );
    };

    /*
     * Apps Script calls this function after returning the
     * selected Google Sheets tab.
     */
    window.updateSignageSchedule = function(payload) {
      if (!payload) {
        showError(
          "Apps Script returned no information."
        );
        return;
      }

      if (payload.success !== true) {
        showError(
          payload.error ||
          "Apps Script returned an error."
        );
        return;
      }

      if (!Array.isArray(payload.schedule)) {
        showError(
          "The schedule is not in the expected format."
        );
        return;
      }

      schedule = payload.schedule
        .filter(isValidScheduleItem)
        .map(item => ({
          time: String(item.time).trim(),
          image: String(item.image).trim(),
          fade: normalizeFade(item.fade)
        }))
        .sort((a, b) =>
          a.time.localeCompare(b.time)
        );

      if (schedule.length === 0) {
        showError(
          `The tab "${SCREEN_NAME}" has no valid schedule rows.`
        );
        return;
      }

      setStatus(
        `Screen: ${SCREEN_NAME} — ` +
        `${schedule.length} schedule item(s)`
      );

      preloadScheduleImages();
      evaluateSchedule();
    };

    function isValidScheduleItem(item) {
      return (
        item &&
        typeof item.time === "string" &&
        /^\d{2}:\d{2}$/.test(item.time) &&
        typeof item.image === "string" &&
        item.image.trim() !== ""
      );
    }

    function normalizeFade(value) {
      const fade = Number(value);

      if (!Number.isFinite(fade) || fade < 0) {
        return DEFAULT_FADE_MS;
      }

      return Math.min(fade, 10000);
    }

    function loadScheduleFeed() {
      if (
        !SCHEDULE_FEED_URL ||
        SCHEDULE_FEED_URL.includes(
          "PASTE_YOUR_APPS_SCRIPT"
        )
      ) {
        showError(
          "The Apps Script URL has not been entered."
        );
        return;
      }

      feedRequestNumber += 1;

      const previousScript =
        document.getElementById(
          "schedule-feed-script"
        );

      if (previousScript) {
        previousScript.remove();
      }

      const script =
        document.createElement("script");

      script.id = "schedule-feed-script";
      script.async = true;

      const separator =
        SCHEDULE_FEED_URL.includes("?")
          ? "&"
          : "?";

      script.src =
        `${SCHEDULE_FEED_URL}` +
        `${separator}callback=updateSignageSchedule` +
        `&screen=${encodeURIComponent(SCREEN_NAME)}` +
        `&_=${Date.now()}` +
        `&request=${feedRequestNumber}`;

      script.onerror = function() {
        showError(
          `Could not load the schedule for "${SCREEN_NAME}".`
        );
      };

      document.head.appendChild(script);

      setStatus(
        `Loading schedule for: ${SCREEN_NAME}`
      );
    }

    function getCurrentHHMM() {
      const now = new Date();

      const hours =
        String(now.getHours()).padStart(2, "0");

      const minutes =
        String(now.getMinutes()).padStart(2, "0");

      return `${hours}:${minutes}`;
    }

    function getActiveScheduleItem(currentTime) {
      if (schedule.length === 0) {
        return null;
      }

      /*
       * Use the final entry as the overnight default.
       */
      let activeItem =
        schedule[schedule.length - 1];

      for (const item of schedule) {
        if (item.time <= currentTime) {
          activeItem = item;
        } else {
          break;
        }
      }

      return activeItem;
    }

    function evaluateSchedule() {
      if (schedule.length === 0) {
        return;
      }

      const currentTime =
        getCurrentHHMM();

      const activeItem =
        getActiveScheduleItem(currentTime);

      if (!activeItem) {
        showError(
          `No active image at ${currentTime}.`
        );
        return;
      }

      setStatus(
        `${SCREEN_NAME} — ` +
        `${currentTime} — ` +
        `${activeItem.image}`
      );

      if (
        activeItem.image !== currentImageName
      ) {
        crossfadeTo(
          activeItem.image,
          activeItem.fade
        );
      }

      preloadNextImage(activeItem);
    }

    function getImageUrl(filename) {
      /*
       * This supports images in the same repository folder
       * as index.html.
       *
       * Examples:
       * image1.jpg
       * arcade/image1.jpg
       */
      return encodeURI(filename);
    }

    function crossfadeTo(
      filename,
      fadeDuration
    ) {
      const incoming =
        visibleLayer === "A"
          ? imageB
          : imageA;

      const outgoing =
        visibleLayer === "A"
          ? imageA
          : imageB;

      const imageUrl =
        getImageUrl(filename);

      incoming.onload = function() {
        incoming.style.transitionDuration =
          `${fadeDuration}ms`;

        outgoing.style.transitionDuration =
          `${fadeDuration}ms`;

        /*
         * Make sure the incoming image is above the old one.
         */
        incoming.style.zIndex = "2";
        outgoing.style.zIndex = "1";

        incoming.classList.add("visible");
        outgoing.classList.remove("visible");

        visibleLayer =
          visibleLayer === "A"
            ? "B"
            : "A";

        currentImageName = filename;

        setStatus(
          `${SCREEN_NAME} — ` +
          `${getCurrentHHMM()} — ` +
          `${filename}`
        );
      };

      incoming.onerror = function() {
        showError(
          `Image not found: ${filename}`
        );
      };

      incoming.src =
        `${imageUrl}?version=${Date.now()}`;
    }

    function preloadScheduleImages() {
      for (const item of schedule) {
        const preloadImage = new Image();

        preloadImage.src =
          getImageUrl(item.image);
      }
    }

    function preloadNextImage(activeItem) {
      const currentIndex =
        schedule.findIndex(item =>
          item.time === activeItem.time &&
          item.image === activeItem.image
        );

      if (currentIndex < 0) {
        return;
      }

      const nextIndex =
        (currentIndex + 1) %
        schedule.length;

      const preloadImage = new Image();

      preloadImage.src =
        getImageUrl(
          schedule[nextIndex].image
        );
    }

    function setStatus(message) {
      statusElement.textContent = message;
      console.log(message);
    }

    function showError(message) {
      statusElement.textContent = message;
      statusElement.style.display = "block";

      console.error(message);
    }

    loadScheduleFeed();

    setInterval(
      loadScheduleFeed,
      SCHEDULE_REFRESH_MS
    );

    setInterval(
      evaluateSchedule,
      CLOCK_CHECK_MS
    );

    document.addEventListener(
      "visibilitychange",
      function() {
        if (!document.hidden) {
          loadScheduleFeed();
          evaluateSchedule();
        }
      }
    );
  </script>
</body>
</html>
